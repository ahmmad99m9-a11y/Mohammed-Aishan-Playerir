name: Build APK

on:
  push:
    branches: [ release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إعداد الجافا بالإصدار المدعوم والمستقر
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. إعداد أداة Gradle الرسمية لإدارة الكاش والذاكرة
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 3. إعطاء صلاحيات التشغيل لملف البناء الخاص بالمشروع
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء التطبيق وإجبار النظام على طباعة تفاصيل الخطأ البرمجي بدقة
      - name: Build Demo APK
        run: ./gradlew :demos:main:assembleDebug --no-daemon --info --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      # 5. رفع ملف الـ APK عند نجاح العملية
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Aishan-Player-APK
          path: demos/main/build/outputs/apk/debug/*.apk
