name: Build APK

on:
  push:
    branches: [ release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تحديث إجراء الجافا للإصدار v4 المستقر والدعم الكامل للـ Cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # استخدام الأداة الرسمية لضبط الـ Gradle بأمان وتجنب مشاكل الـ Daemon
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # البناء مع إضافة أمر تعطيل الـ Daemon لإجبارها على إظهار الخطأ الحقيقي إن وجد
      - name: Build Demo APK
        run: ./gradlew :demos:main:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Aishan-Player-APK
          path: demos/main/build/outputs/apk/debug/*.apk
