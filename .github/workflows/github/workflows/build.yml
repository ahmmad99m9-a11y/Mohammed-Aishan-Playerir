name: Build APK

on:
  push:
    branches: [ release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إعداد الجافا بالإصدار المستقر
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. إعطاء صلاحيات التشغيل لملف البناء
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. خطوة سحرية: تنظيف إعدادات Gradle لتعطيل الـ Daemon إجبارياً داخل النظام
      - name: Disable Gradle Daemon Globally
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      # 4. بناء التطبيق باستخدام أمر تجميع جافا القياسي المباشر لتعرية الخطأ
      - name: Build Demo APK
        run: ./gradlew :demos:main:assembleDebug --stacktrace --stacktrace

      # 5. رفع ملف الـ APK عند نجاح العملية
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Aishan-Player-APK
          path: demos/main/build/outputs/apk/debug/*.apk
