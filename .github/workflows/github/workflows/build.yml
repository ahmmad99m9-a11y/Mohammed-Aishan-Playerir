name: Build APK

on:
  push:
    branches: [ release, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # تثبيت الإصدار المستقر لمنع أخطاء بيئة 24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle Wrapper JAR
        run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar

      - name: Build Demo APK
        run: ./gradlew :demos:main:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohammed-Aishan-Player-APK
          path: demos/main/build/outputs/apk/debug/*.apk
